# Reverse proxy for Wargo. Add your TLS settings (certbot, etc.).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name wargo.example.com;

    # ssl_certificate     /etc/letsencrypt/live/wargo.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/wargo.example.com/privkey.pem;

    # Uploads are chunked (8 MiB), so this only needs to exceed one chunk.
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:2207;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSockets (live metrics, terminal, logs)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # Stream downloads and logs without buffering
        proxy_buffering off;
    }
}
