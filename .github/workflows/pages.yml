# SPDX-License-Identifier: AGPL-3.0-only
#
# Demo site on GitHub Pages (https://kushalpandya.github.io/Wargo/).
#
# Builds the web UI of a release together with the demo sources from the
# gh-pages branch (an in-browser fake backend with made-up data; sign in
# with demo / demo) and publishes it. Nothing from the gh-pages branch ever
# goes into Wargo itself. Started by ci.yml after each release (a release
# created there doesn't trigger "published" here), or by hand with any tag
# or branch.
name: Demo site
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Wargo tag or branch to build (empty = newest release)
        required: false
        default: ""

permissions:
  contents: read

# One deployment at a time; a newer one waits instead of cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.ref }}
        run: |
          set -eu
          ref="$INPUT"
          if [ "${{ github.event_name }}" = release ]; then ref="${{ github.event.release.tag_name }}"; fi
          if [ -z "$ref" ]; then
            ref="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" -q '.[0].tag_name')"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Building the demo from $ref"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}
          path: app
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: demo
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "26", cache: npm, cache-dependency-path: app/web/package-lock.json }
      - run: sh demo/build.sh app site
        env:
          WARGO_REF: ${{ steps.ref.outputs.ref }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
