# SPDX-License-Identifier: AGPL-3.0-only
name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev libcrypt-dev
      - run: make web
      - run: go vet ./... && go test ./...
      - run: make build privd
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) VERSION="0.0.0-dev+${GITHUB_SHA::7}";; esac
          mkdir -p dist/pkg
          tar -czf "dist/wargo_${VERSION}_linux_${{ matrix.arch }}.tar.gz" -C . \
            --transform 's#^bin/##' bin/wargo bin/wargo-privd LICENSE README.md config.example.toml deploy docs
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          for p in deb rpm apk archlinux; do
            VERSION="$VERSION" ARCH=${{ matrix.arch }} ~/go/bin/nfpm pkg -f packaging/nfpm.yaml -p $p -t dist/pkg/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wargo-${{ matrix.arch }}
          path: dist/

  # Multi-arch container image (container mode, see docs/DOCKER.md).
  # Tags: the git tag (e.g. v0.2.0-alpha.1) on v* tags, "latest" only for
  # tags without a pre-release suffix, "edge" for main.
  docker:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: ver
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "version=0.0.0-dev+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT" ;;
          esac
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=edge,branch=main
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
