# SPDX-License-Identifier: AGPL-3.0-only
name: CI
# Minutes are precious on the free plan: pushes and pull requests run one
# quick check; the full multi-arch build, packages, release and images run
# only for v* tags (or when started by hand from the Actions tab).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".gitignore"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".gitignore"]
  workflow_dispatch:

# Least privilege by default; jobs that publish widen it explicitly.
permissions:
  contents: read

defaults:
  run:
    shell: bash

# A newer push supersedes an older run; release tags always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Third-party actions are pinned to commit SHAs (comment = tag at pin time).
jobs:
  # Pushes and PRs: vet, test and compile on amd64 only (~5 minutes).
  check:
    if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.26" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .tool-versions, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: sudo apt-get install -y --no-install-recommends libpam0g-dev
      - run: make web
      - run: go vet ./...
      # macOS must keep compiling (no cgo needed for vet), at no macOS minutes.
      - run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go vet ./...
      - run: go test -race ./...
      - run: make build privd

  # Release builds (tags / manual): amd64 and arm64, packages, checks.
  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # Build on AlmaLinux 8 (glibc 2.28, supported until 2029) so the cgo
    # binary runs on every reasonably modern distribution (Debian 10+,
    # Ubuntu 20.04+, RHEL/Rocky/Alma 8+, Fedora, Arch, openSUSE). Building
    # on the runner itself would require its glibc (2.39).
    container: almalinux:8
    env:
      MAX_GLIBC: "2.28"
      # msteinert/pam builds with -std=c99; glibc < 2.34 only declares
      # RTLD_NEXT with _GNU_SOURCE. (Setting CGO_CFLAGS replaces Go's
      # default "-O2 -g", so keep those.)
      CGO_CFLAGS: "-O2 -g -D_GNU_SOURCE"
    steps:
      - name: Build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            ca-certificates git-core gcc make binutils pam-devel libxcrypt-devel tar gzip xz findutils diffutils which
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.26" }
      # Node 24 here, not the .tool-versions pin: newer Node releases do not run on
      # AlmaLinux 8 (glibc 2.28). It only builds the web UI, so the output is the same.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make web
      - run: go vet ./...
      # Run tests unprivileged, the way Wargo runs: several security checks
      # (e.g. wargo-privd's) deliberately behave differently as root, and
      # the job container runs as root.
      - name: Test (as an unprivileged user)
        run: |
          useradd -m tester
          chown -R tester "$GITHUB_WORKSPACE"
          su tester -c "export PATH='$PATH' CGO_CFLAGS='$CGO_CFLAGS'; cd '$GITHUB_WORKSPACE' && go test -race ./..."
      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) VERSION="0.0.0-dev+${GITHUB_SHA::7}";; esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          LDFLAGS="-s -w -X github.com/kushalpandya/wargo/internal/server.Version=$VERSION"
          # Native build: PAM + libc only (no libcrypt, see internal/auth/crypt_cgo.go).
          CGO_ENABLED=1 go build -trimpath -ldflags "$LDFLAGS" -o bin/wargo ./cmd/wargo
          CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o bin/wargo-privd ./cmd/wargo-privd
          # Container-mode binary for the Docker image (adds libxcrypt for
          # host /etc/shadow checks); packaged by the docker job below.
          CGO_ENABLED=1 go build -trimpath -tags wargo_container -ldflags "$LDFLAGS" -o dist/container/wargo ./cmd/wargo
      - name: Check portability (glibc symbols, shared libraries)
        run: |
          set -eu
          max=$(objdump -T bin/wargo | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "highest GLIBC symbol version: $max (limit $MAX_GLIBC)"
          if [ "$(printf '%s\n%s\n' "$max" "$MAX_GLIBC" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
            echo "::error::bin/wargo needs GLIBC_$max > $MAX_GLIBC"; exit 1
          fi
          readelf -d bin/wargo | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' | sort > needed.txt
          cat needed.txt
          # libresolv is part of glibc on every distribution (cgo DNS resolver).
          if grep -vxE 'libpam\.so\.0|libc\.so\.6|libresolv\.so\.2|libpthread\.so\.0|libdl\.so\.2' needed.txt; then
            echo "::error::unexpected shared library dependency"; exit 1
          fi
          if readelf -d bin/wargo-privd | grep -q NEEDED; then
            echo "::error::wargo-privd must be static"; exit 1
          fi
      - name: Package
        run: |
          set -eu
          mkdir -p dist/pkg
          tar -czf "dist/wargo_${VERSION}_linux_${{ matrix.arch }}.tar.gz" -C . \
            --owner=0 --group=0 --transform 's#^bin/##' \
            bin/wargo bin/wargo-privd LICENSE README.md config.example.toml deploy docs
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          for p in deb rpm apk archlinux; do
            VERSION="$VERSION" ARCH=${{ matrix.arch }} "$(go env GOPATH)/bin/nfpm" pkg -f packaging/nfpm.yaml -p $p -t dist/pkg/
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wargo-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  # Native macOS build and tests (tags / manual). The artifact name is
  # outside the release job's wargo-* pattern: nothing is published for
  # macOS yet, because binaries would need signing and notarization.
  macos:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.26" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .tool-versions, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make web
      - run: go vet ./...
      - run: go test ./...
      - name: Build (arm64 and amd64)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) VERSION="0.0.0-dev+${GITHUB_SHA::7}";; esac
          LDFLAGS="-s -w -X github.com/kushalpandya/wargo/internal/server.Version=$VERSION"
          CGO_ENABLED=1 go build -trimpath -ldflags "$LDFLAGS" -o dist/macos/wargo_darwin_arm64 ./cmd/wargo
          CGO_ENABLED=1 GOARCH=amd64 CC="clang -arch x86_64" go build -trimpath -ldflags "$LDFLAGS" -o dist/macos/wargo_darwin_amd64 ./cmd/wargo
          file dist/macos/wargo_darwin_arm64 | grep -q 'arm64'
          file dist/macos/wargo_darwin_amd64 | grep -q 'x86_64'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-binaries
          path: dist/macos/
          if-no-files-found: error

  # GitHub Release with the tarballs, packages and one SHA256SUMS file.
  # Asset names are relied upon by install.sh:
  #   wargo_<version>_linux_<amd64|arm64>.tar.gz and SHA256SUMS
  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write # start the demo site build (pages.yml)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: wargo-*
          merge-multiple: true
      - name: Checksums
        run: |
          set -eu
          mkdir release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' -o -name '*.apk' -o -name '*.pkg.tar.zst' \) \
            -exec cp {} release/ \;
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          pre=""
          case "$TAG" in *-*) pre="--prerelease";; esac
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "Wargo $TAG" \
            --generate-notes --verify-tag $pre
          # A release made with GITHUB_TOKEN doesn't trigger other workflows,
          # so start the demo site build for this tag directly.
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$TAG"

  # Multi-arch container image (container mode, see docs/DOCKER.md), built
  # from the binaries the build job compiled natively on each architecture
  # (deploy/docker/Dockerfile.release) so nothing compiles under emulation.
  # Tags: the version (e.g. v1.0.0) on every v* tag; "next" on every tag,
  # pre-releases included; "latest" on stable tags only (no "-" suffix).
  docker:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: wargo-amd64, path: ctx/amd64 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: wargo-arm64, path: ctx/arm64 }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Registry names must be lowercase (the GitHub repo is "Wargo").
          images: ghcr.io/kushalpandya/wargo
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=next
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ctx
          file: deploy/docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
